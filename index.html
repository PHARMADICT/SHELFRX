<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4ECDC4">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>PharmaTrack Complete</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        :root {
            --bg-main: #F5F7FA;
            --bg-card: #FFFFFF;
            --bg-input: #F0F3F8;
            --coral: #FF6B6B;
            --coral-light: #FFE5E5;
            --coral-dark: #E85555;
            --teal: #4ECDC4;
            --teal-light: #E0F7F5;
            --teal-dark: #3DB9B1;
            --yellow: #FFD93D;
            --yellow-light: #FFF8E0;
            --yellow-dark: #E5C235;
            --blue: #6C9BCF;
            --blue-light: #E8F1FA;
            --blue-dark: #5A89BD;
            --purple: #9B7EDE;
            --purple-light: #F0EBFA;
            --text-dark: #2D3748;
            --text-medium: #4A5568;
            --text-light: #718096;
            --text-muted: #A0AEC0;
            --success: #48BB78;
            --success-bg: #E6F7ED;
            --warning: #F6AD55;
            --warning-bg: #FFF5E6;
            --danger: #FC8181;
            --danger-bg: #FFF0F0;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.12);
            --radius-sm: 12px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --radius-full: 9999px;
            --header-height: 60px;
            --nav-height: 70px;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --transition-fast: 0.15s ease;
            --transition-default: 0.25s ease;
            --font-main: 'Poppins', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-main);
            background: var(--bg-main);
            color: var(--text-dark);
            line-height: 1.5;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background: var(--bg-main);
            position: relative;
            padding-bottom: calc(var(--nav-height) + var(--safe-bottom));
        }
        .app-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #E2E8F0;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--teal), var(--teal-dark));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            font-weight: 700;
        }
        .logo-text h1 {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-dark);
        }
        .logo-text p {
            font-size: 11px;
            color: var(--text-light);
            font-weight: 500;
        }
        .main-content {
            padding: 16px;
        }
        .page {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .page.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .page-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 16px;
            text-align: center;
        }
        .card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 16px;
            box-shadow: var(--shadow-md);
            margin-bottom: 16px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 16px;
            border: none;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary {
            background: linear-gradient(135deg, var(--teal), var(--teal-dark));
            color: white;
            box-shadow: 0 4px 16px rgba(78,205,196,0.35);
            flex: 1;
        }
        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-medium);
            border: 1px solid #E2E8F0;
        }
        .btn-danger {
            background: var(--coral);
            color: white;
        }
        .btn-sm { padding: 8px 12px; font-size: 12px; border-radius: var(--radius-sm); }
        .btn-block { width: 100%; }

        .input {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-input);
            border: 2px solid transparent;
            border-radius: var(--radius-md);
            font-size: 14px;
            color: var(--text-dark);
            transition: all 0.2s ease;
            font-family: inherit;
        }
        .input:focus {
            outline: none;
            border-color: var(--teal);
            background: white;
        }
        .input-group { display: flex; gap: 8px; }
        .input-group .input { flex: 1; }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background: rgba(255,255,255,0.98);
            backdrop-filter: blur(20px);
            border-top: 1px solid #E2E8F0;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 6px 8px;
            padding-bottom: var(--safe-bottom);
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 6px 4px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            font-size: 10px;
            font-weight: 600;
            flex: 1;
            max-width: 70px;
        }
        .nav-item.active { color: var(--teal); }
        .nav-item svg { width: 22px; height: 22px; }
        .nav-item-icon {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
        }
        .nav-item.active .nav-item-icon {
            background: var(--teal-light);
            border-radius: 8px;
        }
        .nav-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            min-width: 16px;
            height: 16px;
            background: var(--coral);
            border-radius: 50%;
            font-size: 9px;
            font-weight: 700;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== PLANNER PAGE ===== */
        .planner-container {
            padding: 8px 0;
        }
        .planner-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .planner-stats {
            display: flex;
            gap: 10px;
            font-size: 11px;
            color: var(--text-light);
        }
        .planner-stats span {
            background: var(--bg-card);
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 600;
        }
        .planner-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding-bottom: 20px;
        }
        .planner-card {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 12px;
            box-shadow: var(--shadow-sm);
            border-left: 4px solid var(--teal);
            cursor: pointer;
            transition: all 0.2s ease;
            min-height: 140px;
            display: flex;
            flex-direction: column;
        }
        .planner-card:active { transform: scale(0.97); }
        .planner-card.expiry-critical { border-left-color: var(--danger); background: var(--danger-bg); }
        .planner-card.expiry-soon { border-left-color: var(--warning); background: var(--warning-bg); }
        .planner-card.expiry-ok { border-left-color: var(--success); }
        .planner-card .card-img {
            width: 100%;
            height: 50px;
            background: var(--bg-input);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            font-size: 24px;
            overflow: hidden;
        }
        .planner-card .card-img img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .planner-card .card-name {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .planner-card .card-details {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            font-size: 9px;
            color: var(--text-light);
            margin-bottom: 6px;
        }
        .planner-card .card-details span {
            background: var(--bg-input);
            padding: 2px 6px;
            border-radius: 4px;
        }
        .planner-card .card-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            font-size: 10px;
            color: var(--text-light);
        }
        .battery-bar {
            width: 30px;
            height: 6px;
            background: var(--bg-input);
            border-radius: 3px;
            overflow: hidden;
        }
        .battery-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s ease;
        }
        .battery-fill.critical { background: var(--danger); }
        .battery-fill.low { background: var(--warning); }
        .battery-fill.full { background: var(--success); }

        /* Modal for editing product */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 20px;
            width: 100%;
            max-width: 380px;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .modal-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            text-align: center;
        }
        .modal-field { margin-bottom: 12px; }
        .modal-field label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .modal-actions { display: flex; gap: 8px; margin-top: 16px; }

        /* Toast */
        .toast-container {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 300;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: calc(100% - 40px);
            max-width: 400px;
            pointer-events: none;
        }
        .toast {
            padding: 12px 16px;
            background: var(--bg-card);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: toastIn 0.3s ease;
            pointer-events: auto;
            font-size: 13px;
            font-weight: 500;
        }
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .toast.success { border-left: 4px solid var(--success); }
        .toast.error { border-left: 4px solid var(--danger); }
        .toast.warning { border-left: 4px solid var(--warning); }

        .empty-state {
            text-align: center;
            padding: 30px 16px;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }
        .empty-state svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: 0.4; }
        .empty-state p { font-size: 13px; }

        @media (max-width: 380px) {
            .planner-grid { grid-template-columns: 1fr; }
            .nav-item { font-size: 9px; }
            .nav-item svg { width: 20px; height: 20px; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo">
                <div class="logo-icon">💊</div>
                <div class="logo-text">
                    <h1>PharmaTrack</h1>
                    <p>Oasis Mall Branch</p>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- SCANNER PAGE -->
            <div class="page" id="page-scan">
                <h2 class="page-title">Scan Barcode</h2>
                <div class="card">
                    <div id="reader" style="width:100%;height:280px;border-radius:12px;overflow:hidden;"></div>
                    <button class="btn btn-primary btn-block" id="btnStartScanner" style="margin-top:12px;">Start Scanner</button>
                </div>
                <div class="card">
                    <div style="font-size:14px;font-weight:600;margin-bottom:8px;">Manual Entry</div>
                    <div class="input-group">
                        <input type="text" class="input" id="manualInput" placeholder="Enter barcode...">
                        <button class="btn btn-primary" id="btnManualAdd" style="flex:0 0 auto;">Add</button>
                    </div>
                </div>
                <div class="card">
                    <div style="font-size:14px;font-weight:600;margin-bottom:8px;">Recent Scans</div>
                    <div id="recentScans"></div>
                </div>
            </div>

            <!-- HISTORY PAGE -->
            <div class="page" id="page-history">
                <h2 class="page-title">Scan History</h2>
                <div class="card">
                    <input type="text" class="input" id="historySearch" placeholder="Search...">
                    <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;">
                        <button class="btn btn-sm btn-secondary filter-btn active" data-filter="all">All</button>
                        <button class="btn btn-sm btn-secondary filter-btn" data-filter="expired">Expired</button>
                        <button class="btn btn-sm btn-secondary filter-btn" data-filter="soon">Soon</button>
                        <button class="btn btn-sm btn-secondary filter-btn" data-filter="ok">OK</button>
                    </div>
                </div>
                <div id="historyList"></div>
            </div>

            <!-- MANUAL PAGE -->
            <div class="page" id="page-manual">
                <h2 class="page-title">Manual Entry</h2>
                <div class="card">
                    <textarea class="input" id="pasteArea" style="min-height:150px;resize:vertical;" placeholder="Paste barcodes here, one per line..."></textarea>
                    <div style="display:flex;gap:8px;margin-top:12px;">
                        <button class="btn btn-secondary" id="btnClearPaste">Clear</button>
                        <button class="btn btn-primary" id="btnProcessPaste">Process</button>
                    </div>
                    <div id="pasteStats" style="display:none;margin-top:12px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;">
                        <div class="card" style="margin:0;text-align:center;"><strong id="statTotal">0</strong><br><small>Total</small></div>
                        <div class="card" style="margin:0;text-align:center;"><strong id="statValid">0</strong><br><small>Valid</small></div>
                    </div>
                </div>
            </div>

            <!-- PLANNER PAGE -->
            <div class="page active" id="page-planner">
                <h2 class="page-title">📦 Shelf Planner</h2>
                <div class="planner-header">
                    <span id="plannerCount" style="font-size:13px;font-weight:600;color:var(--text-medium);">0 products</span>
                    <span id="plannerWarn" style="font-size:12px;color:var(--warning);font-weight:600;">0 ⚠️</span>
                </div>
                <div class="planner-grid" id="plannerGrid"></div>
            </div>

            <!-- SALES PAGE -->
            <div class="page" id="page-sales">
                <h2 class="page-title">📊 Sales Entry</h2>
                <div class="card">
                    <div style="display:flex;gap:8px;margin-bottom:12px;">
                        <input type="number" class="input" id="monthlyTarget" value="250000" placeholder="Monthly Target">
                    </div>
                    <div style="overflow-x:auto;">
                        <table style="width:100%;min-width:600px;font-size:11px;border-collapse:collapse;">
                            <thead>
                                <tr style="background:var(--teal-light);">
                                    <th style="padding:6px;">Time</th>
                                    <th>Sale</th>
                                    <th>TRN</th>
                                    <th>No7</th>
                                    <th>AURA</th>
                                    <th>Units</th>
                                    <th>Footfall</th>
                                </tr>
                            </thead>
                            <tbody id="salesBody"></tbody>
                        </table>
                    </div>
                    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px;">
                        <div class="card" style="margin:0;padding:12px;text-align:center;"><small>Today Total</small><br><strong id="todayTotal">0</strong></div>
                        <div class="card" style="margin:0;padding:12px;text-align:center;"><small>Month</small><br><strong id="monthTotal">0</strong></div>
                    </div>
                </div>
            </div>

            <!-- SETTINGS PAGE -->
            <div class="page" id="page-settings">
                <h2 class="page-title">Settings</h2>
                <div class="card">
                    <div style="font-size:14px;font-weight:600;margin-bottom:8px;">Upload Product Database</div>
                    <input type="file" id="masterFileInput" accept=".csv,.xlsx,.xls" class="input" style="padding:8px;">
                </div>
                <div class="card">
                    <button class="btn btn-secondary btn-block" id="btnExportData" style="margin-bottom:8px;">📤 Export Data</button>
                    <button class="btn btn-danger btn-block" id="btnClearHistory">🗑️ Clear History</button>
                </div>
            </div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="nav-item" data-page="scan">
                <div class="nav-item-icon">🔍</div>
                <span>Scan</span>
            </button>
            <button class="nav-item" data-page="history">
                <div class="nav-item-icon">🕐</div>
                <span>History</span>
            </button>
            <button class="nav-item" data-page="manual">
                <div class="nav-item-icon">📋</div>
                <span>Manual</span>
            </button>
            <button class="nav-item active" data-page="planner">
                <div class="nav-item-icon">📦</div>
                <span>Planner</span>
            </button>
            <button class="nav-item" data-page="sales">
                <div class="nav-item-icon">💰</div>
                <span>Sales</span>
            </button>
            <button class="nav-item" data-page="settings">
                <div class="nav-item-icon">⚙️</div>
                <span>Settings</span>
            </button>
        </nav>
    </div>

    <!-- Product Modal -->
    <div class="modal-overlay" id="productModal">
        <div class="modal">
            <div class="modal-title">Edit Product</div>
            <div class="modal-field">
                <label>Product Name</label>
                <input type="text" class="input" id="editName">
            </div>
            <div class="modal-field">
                <label>Barcode</label>
                <input type="text" class="input" id="editBarcode">
            </div>
            <div class="modal-field">
                <label>Expiry (YYMMDD)</label>
                <input type="text" class="input" id="editExpiry">
            </div>
            <div class="modal-field">
                <label>Batch</label>
                <input type="text" class="input" id="editBatch">
            </div>
            <div class="modal-field">
                <label>Facing (on shelf)</label>
                <input type="number" class="input" id="editFacing" min="0">
            </div>
            <div class="modal-field">
                <label>Total Units (per shelf)</label>
                <input type="number" class="input" id="editUnits" min="0">
            </div>
            <div class="modal-actions">
                <button class="btn btn-danger" id="btnDeleteProduct">Delete</button>
                <button class="btn btn-primary" id="btnSaveProduct">Save</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        (function() {
            // State
            let products = [];
            let history = [];
            let salesData = {};
            let editingId = null;
            let scanner = null;
            let scannerRunning = false;

            const HOUR_SLOTS = [
                { id: 's1', label: '12am-6am' },
                { id: 's2', label: '6-8am' },
                { id: 's3', label: '8-10am' },
                { id: 's4', label: '10-12pm' },
                { id: 's5', label: '12-2pm' },
                { id: 's6', label: '2-4pm' },
                { id: 's7', label: '4-6pm' },
                { id: 's8', label: '6-8pm' },
                { id: 's9', label: '8-10pm' },
                { id: 's10', label: '10-12am' }
            ];

            const $ = (id) => document.getElementById(id);
            const toastContainer = $('toastContainer');

            // Load data
            function loadData() {
                try {
                    const p = localStorage.getItem('pharmatrack_products');
                    if (p) products = JSON.parse(p);
                    else initDemoProducts();
                    const h = localStorage.getItem('pharmatrack_history');
                    if (h) history = JSON.parse(h);
                    const s = localStorage.getItem('pharmatrack_sales');
                    if (s) salesData = JSON.parse(s);
                } catch(e) { initDemoProducts(); }
            }

            function saveProducts() {
                localStorage.setItem('pharmatrack_products', JSON.stringify(products));
            }
            function saveHistory() {
                localStorage.setItem('pharmatrack_history', JSON.stringify(history));
            }
            function saveSales() {
                localStorage.setItem('pharmatrack_sales', JSON.stringify(salesData));
            }

            function initDemoProducts() {
                products = [
                    { id: 'p1', name: 'Paracetamol 500mg', barcode: '8901234567890', expiry: '260630', batch: 'B001', facing: 3, units: 12, image: '' },
                    { id: 'p2', name: 'Ibuprofen 400mg', barcode: '8901234567891', expiry: '250915', batch: 'B002', facing: 2, units: 5, image: '' },
                    { id: 'p3', name: 'Amoxicillin 250mg', barcode: '8901234567892', expiry: '241101', batch: 'B003', facing: 4, units: 2, image: '' },
                    { id: 'p4', name: 'Loratadine 10mg', barcode: '8901234567893', expiry: '260101', batch: 'B004', facing: 2, units: 8, image: '' },
                    { id: 'p5', name: 'Omeprazole 20mg', barcode: '8901234567894', expiry: '250701', batch: 'B005', facing: 3, units: 15, image: '' },
                    { id: 'p6', name: 'Vitamin C 1000mg', barcode: '8901234567895', expiry: '270201', batch: 'B006', facing: 5, units: 20, image: '' },
                ];
                saveProducts();
            }

            function generateId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

            function showToast(msg, type = 'success') {
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.textContent = msg;
                toastContainer.appendChild(toast);
                setTimeout(() => toast.remove(), 2500);
            }

            // Navigation
            function switchPage(pageId) {
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                const page = document.getElementById(`page-${pageId}`);
                const navBtn = document.querySelector(`.nav-item[data-page="${pageId}"]`);
                if (page) page.classList.add('active');
                if (navBtn) navBtn.classList.add('active');
                if (pageId === 'planner') renderPlanner();
                if (pageId === 'history') renderHistory();
                if (pageId === 'scan') renderRecentScans();
                if (pageId === 'sales') renderSales();
                if (pageId !== 'scan' && scannerRunning) stopScanner();
            }

            // Scanner
            async function startScanner() {
                if (scannerRunning) return;
                if (!scanner) scanner = new Html5Qrcode('reader');
                try {
                    await scanner.start(
                        { facingMode: 'environment' },
                        { fps: 10, qrbox: { width: 220, height: 220 } },
                        (decodedText) => {
                            handleScannedCode(decodedText);
                        },
                        () => {}
                    );
                    scannerRunning = true;
                    $('btnStartScanner').textContent = 'Stop Scanner';
                    $('btnStartScanner').classList.remove('btn-primary');
                    $('btnStartScanner').classList.add('btn-danger');
                } catch(err) {
                    showToast('Camera access denied', 'error');
                }
            }

            async function stopScanner() {
                if (!scannerRunning || !scanner) return;
                try { await scanner.stop(); } catch(e) {}
                scannerRunning = false;
                $('btnStartScanner').textContent = 'Start Scanner';
                $('btnStartScanner').classList.remove('btn-danger');
                $('btnStartScanner').classList.add('btn-primary');
            }

            function handleScannedCode(code) {
                let barcode = code;
                let expiry = '';
                let batch = '';
                const gtinMatch = code.match(/01(\d{14})/);
                const expiryMatch = code.match(/17(\d{6})/);
                const batchMatch = code.match(/10([\w\-\.]{1,20})/);
                if (gtinMatch) barcode = gtinMatch[1];
                if (expiryMatch) expiry = expiryMatch[1];
                if (batchMatch) batch = batchMatch[1];

                const existing = products.find(p => p.barcode === barcode);
                if (existing) {
                    history.unshift({ ...existing, qty: 1, timestamp: new Date().toISOString() });
                    saveHistory();
                    showToast(`Added ${existing.name}`, 'success');
                } else {
                    const newProduct = {
                        id: generateId(),
                        name: 'New Product',
                        barcode: barcode,
                        expiry: expiry || '260101',
                        batch: batch || 'N/A',
                        facing: 1,
                        units: 1,
                        image: ''
                    };
                    products.push(newProduct);
                    saveProducts();
                    history.unshift({ ...newProduct, qty: 1, timestamp: new Date().toISOString() });
                    saveHistory();
                    showToast('New product added', 'success');
                }
                stopScanner();
                renderRecentScans();
                renderPlanner();
            }

            function manualAdd() {
                const input = $('manualInput');
                const code = input.value.trim();
                if (!code) { showToast('Enter barcode', 'warning'); return; }
                handleScannedCode(code);
                input.value = '';
            }

            // Planner
            function getExpiryStatus(expiry) {
                if (!expiry || expiry.length < 6) return 'ok';
                const year = 2000 + parseInt(expiry.slice(0,2));
                const month = parseInt(expiry.slice(2,4)) - 1;
                const day = parseInt(expiry.slice(4,6));
                const exp = new Date(year, month, day);
                const now = new Date();
                const diff = (exp - now) / (1000*60*60*24);
                if (diff < 0) return 'critical';
                if (diff < 30) return 'soon';
                return 'ok';
            }

            function getBattery(units) {
                if (units <= 2) return { level: 'critical', pct: 10, label: '🔴 Empty' };
                if (units <= 6) return { level: 'low', pct: 30, label: '🟠 Low' };
                if (units <= 10) return { level: 'full', pct: 70, label: '🟢 Half' };
                return { level: 'full', pct: 100, label: '🟢 Full' };
            }

            function renderPlanner() {
                const grid = $('plannerGrid');
                const count = $('plannerCount');
                const warn = $('plannerWarn');
                if (!grid) return;

                count.textContent = `${products.length} products`;
                let warnCount = 0;
                products.forEach(p => {
                    const status = getExpiryStatus(p.expiry);
                    if (status === 'critical' || status === 'soon') warnCount++;
                });
                warn.textContent = `${warnCount} ⚠️`;

                if (products.length === 0) {
                    grid.innerHTML = `<div class="empty-state"><p>No products yet. Scan or add manually.</p></div>`;
                    return;
                }

                grid.innerHTML = products.map(p => {
                    const status = getExpiryStatus(p.expiry);
                    const battery = getBattery(p.units);
                    const expDisplay = p.expiry.length === 6 ? `${p.expiry.slice(0,2)}/${p.expiry.slice(2,4)}/${p.expiry.slice(4,6)}` : p.expiry;
                    const statusClass = status === 'critical' ? 'expiry-critical' : status === 'soon' ? 'expiry-soon' : 'expiry-ok';
                    const statusBadge = status === 'critical' ? '⚠️ EXPIRED' : status === 'soon' ? '⏳ SOON' : '✓ OK';
                    
                    return `
                    <div class="planner-card ${statusClass}" onclick="openProduct('${p.id}')">
                        <div class="card-img">${p.image || '💊'}</div>
                        <div class="card-name">${p.name}</div>
                        <div class="card-details">
                            <span>📅 ${expDisplay}</span>
                            <span>🧬 ${p.batch}</span>
                            <span>${statusBadge}</span>
                        </div>
                        <div class="card-bottom">
                            <span>Facing: ${p.facing}</span>
                            <span>Units: ${p.units}</span>
                            <span>${battery.label}</span>
                            <div class="battery-bar"><div class="battery-fill ${battery.level}" style="width:${battery.pct}%"></div></div>
                        </div>
                    </div>`;
                }).join('');
            }

            function openProduct(id) {
                const p = products.find(x => x.id === id);
                if (!p) return;
                editingId = id;
                $('editName').value = p.name;
                $('editBarcode').value = p.barcode;
                $('editExpiry').value = p.expiry;
                $('editBatch').value = p.batch;
                $('editFacing').value = p.facing;
                $('editUnits').value = p.units;
                $('productModal').classList.add('active');
            }

            function closeModal() {
                $('productModal').classList.remove('active');
                editingId = null;
            }

            function saveProduct() {
                if (!editingId) return;
                const p = products.find(x => x.id === editingId);
                if (!p) return;
                p.name = $('editName').value || 'Unnamed';
                p.barcode = $('editBarcode').value;
                p.expiry = $('editExpiry').value;
                p.batch = $('editBatch').value;
                p.facing = parseInt($('editFacing').value) || 0;
                p.units = parseInt($('editUnits').value) || 0;
                saveProducts();
                closeModal();
                renderPlanner();
                showToast('Product updated', 'success');
            }

            function deleteProduct() {
                if (!editingId) return;
                if (!confirm('Delete this product?')) return;
                products = products.filter(p => p.id !== editingId);
                saveProducts();
                closeModal();
                renderPlanner();
                showToast('Product deleted', 'warning');
            }

            // History
            function renderHistory() {
                const list = $('historyList');
                if (!list) return;
                if (history.length === 0) {
                    list.innerHTML = '<div class="empty-state"><p>No scan history</p></div>';
                    return;
                }
                const search = ($('historySearch')?.value || '').toLowerCase();
                const activeFilter = document.querySelector('.filter-btn.active')?.dataset.filter || 'all';
                let filtered = history.filter(h => {
                    const hay = `${h.name} ${h.barcode}`.toLowerCase();
                    if (search && !hay.includes(search)) return false;
                    if (activeFilter !== 'all') {
                        const status = getExpiryStatus(h.expiry);
                        if (activeFilter === 'expired' && status !== 'critical') return false;
                        if (activeFilter === 'soon' && status !== 'soon') return false;
                        if (activeFilter === 'ok' && status !== 'ok') return false;
                    }
                    return true;
                });
                if (filtered.length === 0) {
                    list.innerHTML = '<div class="empty-state"><p>No matches found</p></div>';
                    return;
                }
                list.innerHTML = filtered.slice(0, 50).map(h => `
                    <div class="card" style="padding:10px;margin-bottom:6px;">
                        <strong>${h.name}</strong>
                        <div style="font-size:11px;color:var(--text-light);">${h.barcode} • ${new Date(h.timestamp).toLocaleString()}</div>
                    </div>
                `).join('');
            }

            function renderRecentScans() {
                const list = $('recentScans');
                if (!list) return;
                if (history.length === 0) {
                    list.innerHTML = '<div class="empty-state"><p>No recent scans</p></div>';
                    return;
                }
                list.innerHTML = history.slice(0, 5).map(h => `
                    <div class="card" style="padding:8px;margin-bottom:4px;display:flex;justify-content:space-between;">
                        <span>${h.name}</span>
                        <span style="color:var(--teal);">x${h.qty || 1}</span>
                    </div>
                `).join('');
            }

            // Sales
            function renderSales() {
                const body = $('salesBody');
                if (!body) return;
                const today = new Date().toISOString().slice(0, 10);
                if (!salesData[today]) {
                    salesData[today] = {};
                    HOUR_SLOTS.forEach(s => {
                        salesData[today][s.id] = { sale: 0, trn: 0, no7: 0, aura: 0, units: 0, footfall: 0 };
                    });
                    saveSales();
                }
                let html = '';
                let totalSale = 0;
                HOUR_SLOTS.forEach(s => {
                    const row = salesData[today][s.id] || { sale: 0, trn: 0, no7: 0, aura: 0, units: 0, footfall: 0 };
                    totalSale += row.sale || 0;
                    html += `<tr>
                        <td style="padding:4px;">${s.label}</td>
                        <td><input type="number" class="input" style="padding:2px 4px;font-size:11px;" value="${row.sale}" data-slot="${s.id}" data-field="sale"></td>
                        <td><input type="number" class="input" style="padding:2px 4px;font-size:11px;" value="${row.trn}" data-slot="${s.id}" data-field="trn"></td>
                        <td><input type="number" class="input" style="padding:2px 4px;font-size:11px;" value="${row.no7}" data-slot="${s.id}" data-field="no7"></td>
                        <td><input type="number" class="input" style="padding:2px 4px;font-size:11px;" value="${row.aura}" data-slot="${s.id}" data-field="aura"></td>
                        <td><input type="number" class="input" style="padding:2px 4px;font-size:11px;" value="${row.units}" data-slot="${s.id}" data-field="units"></td>
                        <td><input type="number" class="input" style="padding:2px 4px;font-size:11px;" value="${row.footfall}" data-slot="${s.id}" data-field="footfall"></td>
                    </tr>`;
                });
                body.innerHTML = html;
                $('todayTotal').textContent = totalSale;

                // Month total
                const now = new Date();
                const month = now.getMonth();
                const year = now.getFullYear();
                let monthTotal = 0;
                for (const dateKey in salesData) {
                    const d = new Date(dateKey);
                    if (d.getMonth() === month && d.getFullYear() === year) {
                        const dayData = salesData[dateKey];
                        for (const slotId in dayData) {
                            monthTotal += dayData[slotId].sale || 0;
                        }
                    }
                }
                $('monthTotal').textContent = monthTotal;

                // Attach listeners
                body.querySelectorAll('input').forEach(inp => {
                    inp.addEventListener('input', function() {
                        const slotId = this.dataset.slot;
                        const field = this.dataset.field;
                        const todayKey = new Date().toISOString().slice(0, 10);
                        if (!salesData[todayKey]) return;
                        if (!salesData[todayKey][slotId]) salesData[todayKey][slotId] = { sale: 0, trn: 0, no7: 0, aura: 0, units: 0, footfall: 0 };
                        salesData[todayKey][slotId][field] = Number(this.value) || 0;
                        saveSales();
                        renderSales();
                    });
                });
            }

            // Clear history
            function clearHistory() {
                if (!confirm('Clear all history?')) return;
                history = [];
                saveHistory();
                renderHistory();
                renderRecentScans();
                showToast('History cleared', 'success');
            }

            // Export
            function exportData() {
                const data = { products, history, salesData };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `pharmatrack_backup_${new Date().toISOString().slice(0,10)}.json`;
                a.click();
                showToast('Data exported', 'success');
            }

            // Master upload
            function handleMasterUpload(file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const text = e.target.result;
                    const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
                    lines.slice(1).forEach(line => {
                        const cols = line.split(',').map(c => c.trim());
                        if (cols.length >= 2) {
                            const existing = products.find(p => p.barcode === cols[0]);
                            if (existing) {
                                existing.name = cols[1];
                            } else {
                                products.push({
                                    id: generateId(),
                                    name: cols[1],
                                    barcode: cols[0],
                                    expiry: cols[2] || '260101',
                                    batch: cols[3] || 'N/A',
                                    facing: parseInt(cols[4]) || 1,
                                    units: parseInt(cols[5]) || 1,
                                    image: ''
                                });
                            }
                        }
                    });
                    saveProducts();
                    renderPlanner();
                    showToast('Master data loaded', 'success');
                };
                reader.readAsText(file);
            }

            // Bind events
            function bindEvents() {
                document.querySelectorAll('.nav-item').forEach(btn => {
                    btn.addEventListener('click', () => switchPage(btn.dataset.page));
                });

                $('btnStartScanner').addEventListener('click', () => {
                    if (scannerRunning) stopScanner();
                    else startScanner();
                });

                $('btnManualAdd').addEventListener('click', manualAdd);
                $('manualInput').addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') manualAdd();
                });

                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        renderHistory();
                    });
                });

                $('historySearch').addEventListener('input', renderHistory);

                $('btnSaveProduct').addEventListener('click', saveProduct);
                $('btnDeleteProduct').addEventListener('click', deleteProduct);
                $('productModal').addEventListener('click', (e) => {
                    if (e.target === e.currentTarget) closeModal();
                });

                $('btnClearPaste').addEventListener('click', () => {
                    $('pasteArea').value = '';
                });

                $('btnProcessPaste').addEventListener('click', () => {
                    const text = $('pasteArea').value;
                    const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
                    let valid = 0;
                    lines.forEach(line => {
                        if (line.length >= 8) {
                            handleScannedCode(line);
                            valid++;
                        }
                    });
                    $('statTotal').textContent = lines.length;
                    $('statValid').textContent = valid;
                    $('pasteStats').style.display = 'grid';
                });

                $('btnClearHistory').addEventListener('click', clearHistory);
                $('btnExportData').addEventListener('click', exportData);

                $('masterFileInput').addEventListener('change', (e) => {
                    if (e.target.files.length) handleMasterUpload(e.target.files[0]);
                });

                $('monthlyTarget').addEventListener('input', renderSales);

                // Expose functions globally
                window.openProduct = openProduct;
            }

            function init() {
                loadData();
                bindEvents();
                renderPlanner();
                renderRecentScans();
                renderHistory();
                renderSales();
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
